<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>OptoMind</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #312e81 0%, #0f172a 55%, #0c4a6e 100%);
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { text-align: center; user-select: none; }
  .logo {
    width: 72px; height: 72px; margin: 0 auto 18px;
    border-radius: 20px;
    background: linear-gradient(180deg, #312e81, #0ea5e9);
    position: relative;
    box-shadow: 0 10px 30px rgba(14,165,233,.35);
  }
  .logo::after {
    content: ""; position: absolute; inset: 16px;
    border: 6px solid #fff; border-radius: 50%;
  }
  .dot { position: absolute; top: -4px; right: -4px; width: 14px; height: 14px;
    background: #fde047; border-radius: 50%; }
  h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: 2px; }
  p { font-size: 13px; color: #94a3b8; margin: 0; }
  .bar { width: 220px; height: 5px; border-radius: 3px; background: #1e293b;
    margin: 18px auto 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 40%; border-radius: 3px;
    background: #0ea5e9; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(320%);} }
  #err { display: none; max-width: 380px; text-align: left; line-height: 1.7;
    font-size: 13px; color: #fecaca; background: #450a0a; border-radius: 10px;
    padding: 12px 16px; margin-top: 14px; }
  button { display: none; margin-top: 12px; padding: 8px 20px; border-radius: 8px;
    border: 0; background: #0ea5e9; color: #04283c; font-weight: 700; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .bar > i { animation: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span class="dot"></span></div>
    <h1>OptoMind</h1>
    <p id="msg">正在启动本地服务…（仅绑定 127.0.0.1）</p>
    <div class="bar"><i></i></div>
    <div id="err"></div>
    <button id="retry" onclick="location.reload()">重试</button>
  </div>
<script>
(function () {
  var waited = 0, limit = 40000;
  function port() { return window.__PORT | 0; }
  function fail(title, detail) {
    document.getElementById("msg").textContent = title;
    var e = document.getElementById("err");
    e.style.display = "block"; e.textContent = detail;
    document.getElementById("retry").style.display = "inline-block";
  }
  function tick() {
    var p = port();
    if (!p) {
      if ((waited += 200) > 8000) fail("启动异常", "外壳未注入端口，请点重试。");
      else setTimeout(tick, 200);
      return;
    }
    fetch("http://127.0.0.1:" + p + "/api/preflight", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        // Blocking failures must land on the doctor page, not the main UI.
        var target = data && data.ready ? "/" : "/onboarding";
        location.replace("http://127.0.0.1:" + p + target);
      })
      .catch(function () {
        if ((waited += 500) >= limit) {
          fail("本地服务启动超时",
            "sidecar 在 40 秒内未就绪。常见原因：安全软件拦截回环端口或依赖缺失。\n日志：%TEMP%\\optomind-sidecar.log");
        } else setTimeout(tick, 500);
      });
  }
  tick();
})();
</script>
</body>
</html>
