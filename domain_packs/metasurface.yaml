    - metasurface
    - meta-optics
    - 超表面
  holography:
    - holography
    - holographic display
    - 全息
  inverse_design:
    - inverse design
    - inverse electromagnetic design
    - 逆向设计
aliases:
  fabrication:
    - nanofabrication
    - 制造工艺
retrieval:
  query_expansion:
    - metasurface holography
    - inverse design meta-optics
    - dynamic holographic display
    - metasurface imaging
  preferred_sources:
    - Optica Publishing Group
    - Nature Photonics
evidence:
  roles:
    - phase_control
    - fabrication
    - dynamic_modulation
    - imaging_application
measurements:
  units:
    wavelength: [nm, um, μm]
    efficiency: ["%"]
    numerical_aperture: []
  conversions:
    - wavelength_nm_to_um
outline:
  priors:
    - inverse design and physical constraints
    - fabrication and device tolerance
    - dynamic display and imaging application
visual:
  preferred_types:
    - mechanism
    - device_architecture
    - fabrication_flow
    - application_example
