schema_version: optomind.domain_pack.v1
domain_id: metasurface
display_name: 超表面与纳米光学
version: 1.0.0
extends:
  - ai_for_optics
merge:
  append:
    - domain_boundaries
    - related_domains
    - retrieval.query_expansion
    - retrieval.preferred_sources
    - evidence.roles
    - measurements.conversions
    - outline.priors
    - visual.preferred_types
    - migration.compatible_schemas
    - migration.legacy_names
  replace:
    - domain_id
    - display_name
    - version
domain_boundaries:
  - 亚波长结构、超表面全息、动态调控与计算成像器件
related_domains:
  - nanophotonics
  - computational_imaging
canonical_concepts:
