  retrieval_quality:
    - retrieval quality
    - retrieval evaluation
    - 检索质量
aliases:
  benchmark:
    - benchmark
    - evaluation dataset
    - 基准数据集
retrieval:
  query_expansion:
    - retrieval augmented generation factuality
    - retrieval quality evaluation
    - citation grounded generation
  preferred_sources:
    - ACL Anthology
    - arXiv
evidence:
  roles:
    - retriever
    - generator
    - factuality_evaluation
    - benchmark
    - citation_grounding
