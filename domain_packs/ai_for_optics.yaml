schema_version: optomind.domain_pack.v1
domain_id: ai_for_optics
display_name: AI for Optics
version: 1.0.0
extends:
  - base_research_review
merge:
  append:
    - domain_boundaries
    - related_domains
    - ambiguous_terms
    - retrieval.query_expansion
    - retrieval.preferred_sources
    - evidence.roles
    - measurements.conversions
    - terminology.definitions
    - outline.priors
    - visual.preferred_types
    - migration.compatible_schemas
    - migration.legacy_names
  replace:
    - domain_id
    - display_name
    - version
    - terminology.acronym_policy
    - quality.thresholds.citation_coverage
domain_boundaries:
  - 光学器件、光子系统、计算成像与智能光学的研究证据
  - 连接材料、器件、算法、实验和应用层的跨层技术判断
related_domains:
  - nanophotonics
  - integrated_photonics
  - computational_imaging
canonical_concepts:
  photonic_device:
    - photonic device
    - optical device
    - 光子器件
  computational_optics:
    - computational optics
    - computational imaging
    - 计算光学
  optical_system:
    - optical system
    - photonic system
    - 光学系统
aliases:
  optics:
    - optics
    - optical
    - 光学
  photonics:
    - photonics
    - 光子学
ambiguous_terms:
  - aperture
  - layer
retrieval:
  query_expansion:
    - photonic device
    - optical system
    - computational optics
    - AI for optics
  preferred_sources:
    - arXiv
    - PubMed Central
evidence:
  roles:
    - device_design
    - physical_mechanism
    - algorithm
    - experimental_validation
    - system_application
measurements:
  units:
    wavelength: [nm, um, μm]
    frequency: [Hz, GHz, THz]
    efficiency: ["%"]
    optical_power: [W, mW]
  conversions:
    - wavelength_nm_to_um
terminology:
  acronym_policy: 光学术语首次出现定义全称，跨章节沿用统一简称
  definitions:
    - optical field
    - photonic integrated circuit
outline:
  priors:
    - physical problem and optical constraints
    - device and algorithm co-design
    - experimental or system-level evidence
visual:
  preferred_types:
    - mechanism
    - architecture
    - comparison
    - roadmap
  section_role_keywords:
    mechanism:
      - mechanism
      - physics
      - optical field
      - propagation
      - interaction
    device:
      - device
      - architecture
      - photonic chip
      - component
      - fabrication
    algorithm:
      - algorithm
      - inverse design
      - computation
      - optimization
      - model
    application:
      - application
      - imaging
      - communication
      - sensing
      - deployment
    challenges:
      - challenge
      - limitation
      - bottleneck
      - future
      - prospect
quality:
  thresholds:
    citation_coverage: 0.85
