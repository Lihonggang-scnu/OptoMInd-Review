schema_version: optomind.domain_pack.v1
domain_id: diffractive_computing
display_name: 衍射光学计算
version: 1.0.0
extends:
  - ai_for_optics
merge:
  append:
    - domain_boundaries
    - related_domains
    - retrieval.query_expansion
    - retrieval.preferred_sources
    - evidence.roles
    - measurements.conversions
    - outline.priors
    - visual.preferred_types
    - migration.compatible_schemas
    - migration.legacy_names
  replace:
    - domain_id
    - display_name
    - version
domain_boundaries:
  - 衍射传播、光学神经网络、端到端训练与成像识别
related_domains:
  - computational_imaging
  - machine_learning
canonical_concepts:
  diffractive_network:
    - diffractive neural network
    - diffractive optical network
    - 衍射神经网络
  optical_inference:
    - optical inference
    - photonic inference
    - 光学推理
  wave_propagation:
    - wave propagation
    - diffraction propagation
    - 波传播
aliases:
  training:
    - optical training
    - 光学训练
retrieval:
  query_expansion:
    - diffractive neural network
    - diffractive optical computing
    - optical inference imaging
  preferred_sources:
    - Optica Publishing Group
    - IEEE Xplore
evidence:
  roles:
    - propagation_model
    - layer_architecture
    - training_strategy
    - imaging_recognition
measurements:
  units:
    wavelength: [nm, um, μm]
    accuracy: ["%"]
    layer_count: []
  conversions:
    - wavelength_nm_to_um
outline:
  priors:
    - propagation and architecture
    - training and physical implementation
    - imaging recognition and robustness
visual:
  preferred_types:
    - architecture
    - propagation_mechanism
    - performance_comparison
