[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optomind"
version = "0.1.0"
description = "A reproducible literature-review and publication pipeline for optical research."
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.2",
    "arxiv>=2.3",
    "beautifulsoup4>=4.13",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "ftfy>=6.3",
    "json-repair>=0.47",
    "lxml>=5.4",
    "matplotlib>=3.11",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "openai>=2.43",
    "pandas>=2.2",
    # playwright（可选，极不推荐开启）：
    #   仅用于 institutional_access 分支 —— 以学校图书馆账号登录出版商
    #   站点抓取付费墙后全文。实测 OA 论文的可用性与引用价值更高，
    #   开启该分支后人工登录成本高、边际收益低，故 OptoMind 默认关闭
    #   （config/literature_backends.yaml: institutional_access.enabled: false）
    #   而保留代码。走默认 OA 路线无需 `playwright install chromium`，
    #   不下载约 400 MB 浏览器内核。
    #   需要该分支时：pip install -e ".[institutional]" && playwright install chromium
    "pymupdf>=1.27",
    "pypdf>=5.0",
    "pydantic>=2.10",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.13",
    "scikit-learn>=1.5",
    "sse-starlette>=2.3",
    "tavily-python>=0.7",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
# institutional_access 分支专用（默认关闭，见 dependencies 内注释）：
institutional = [
    "playwright>=1.49",
]

[tool.setuptools.packages.find]
include = ["optomind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["external_tools", "optmind-legacy", ".git", ".venv"]
